<!DOCTYPE html>
<HTML>
<HEAD>
<meta charset="UTF-8">
<title>今天練習的Java Script</title>
<style>
  /* 基本排版 */
  body {
    font-family: "Microsoft JhengHei", Arial, sans-serif;
    text-align: center;
    padding-top: 150px; /* 往下壓一點，讓煙火有空間噴發 */
    transition: background 0.2s ease;
    overflow-x: hidden;
  }

  /* 誇張的按鈕外觀 */
  .crazy-btn {
    position: relative;
    padding: 20px 50px;
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    background: linear-gradient(90deg, #ff00cc, #3333ff, #ff00cc);
    background-size: 200% auto;
    border: 4px solid #fff;
    border-radius: 15px;
    cursor: pointer;
    box-shadow: 0 0 20px #ff00cc, inset 0 0 10px #3333ff;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    transition: all 0.2s ease;
    animation: gradientMove 3s infinite linear; /* 背景顏色流動 */
  }

  .crazy-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 40px #ff00cc, inset 0 0 20px #3333ff;
  }

  /* --- 點擊時的按鈕變形動畫 (橡皮筋擠壓) --- */
  .smash-active {
    animation: smash 0.5s cubic-bezier(0.25, 1, 0.5, 1) !important;
  }

  @keyframes smash {
    0% { transform: scale(1); }
    20% { transform: scale(1.6, 0.4) translateY(30px); filter: brightness(2); }
    50% { transform: scale(0.6, 1.4) translateY(-20px); }
    70% { transform: scale(1.2, 0.8) translateY(10px); }
    100% { transform: scale(1); }
  }

  /* --- 畫面大地震動畫 --- */
  .shake-screen {
    animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }

  @keyframes shake {
    0% { transform: translate(0, 0) rotate(0deg); }
    10% { transform: translate(-20px, -20px) rotate(-5deg); }
    20% { transform: translate(25px, 15px) rotate(4deg); }
    30% { transform: translate(-25px, 20px) rotate(-6deg); }
    40% { transform: translate(20px, -25px) rotate(5deg); }
    50% { transform: translate(-15px, 10px) rotate(-4deg); }
    60% { transform: translate(15px, -15px) rotate(3deg); }
    70% { transform: translate(-10px, 10px) rotate(-2deg); }
    80% { transform: translate(10px, -10px) rotate(1deg); }
    90% { transform: translate(-5px, 5px) rotate(0deg); }
    100% { transform: translate(0, 0); }
  }

  /* --- 爆炸粒子特效 --- */
  .particle {
    position: absolute;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    animation: explode 0.8s ease-out forwards;
    box-shadow: 0 0 10px currentColor;
  }

  @keyframes explode {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    80% { opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }

  @keyframes gradientMove {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }
</style>
</HEAD>

<!-- 保留原有的背景變色 -->
<BODY id="main-body" onclick="document.body.style.background='#D2E9FF'">
<h1>今天練習的Java Script</h1>

<!-- 按鈕綁定超級特效函數 -->
<button class="crazy-btn" onclick="sayhi(event)">加入購物車</button>

<script>
function sayhi(event) {
  // 阻止背景變色干擾按鈕點擊
  event.stopPropagation();
  
  const btn = event.currentTarget;
  const body = document.getElementById("main-body");

  // 1. 讓按鈕劇烈擠壓彈跳
  btn.classList.add("smash-active");

  // 2. 讓整個畫面大地震
  body.classList.add("shake-screen");

  // 3. 噴射彩色煙火爆炸粒子！
  // 迴圈生成 40 顆隨機方向的粒子
  for (let i = 0; i < 40; i++) {
    let particle = document.createElement('div');
    particle.className = 'particle';
    
    // 隨機計算爆炸飛出去的角度與距離
    let angle = Math.random() * Math.PI * 2; // 360度隨機
    let distance = Math.random() * 200 + 50; // 噴射距離 50px ~ 250px
    let tx = Math.cos(angle) * distance;
    let ty = Math.sin(angle) * distance;
    
    // 設定 CSS 變數，讓 keyframes 知道要飛去哪
    particle.style.setProperty('--tx', `${tx}px`);
    particle.style.setProperty('--ty', `${ty}px`);
    
    // 從滑鼠點擊的位置產生
    particle.style.left = `${event.clientX}px`;
    particle.style.top = `${event.clientY}px`;
    
    // 給予隨機的超亮鮮豔色彩
    particle.style.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
    particle.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 60%)`;
    
    document.body.appendChild(particle);

    // 動畫播完後移除粒子元素
    setTimeout(() => {
      particle.remove();
    }, 800);
  }

  // 4. 清除 CSS Class，以便下次點擊還能觸發動畫
  setTimeout(() => {
    btn.classList.remove("smash-active");
    body.classList.remove("shake-screen");
    
    // 5. 動畫播完後再跳出 alert，才不會中斷超炫的視覺效果
    alert("開心！！！💥💥💥");
  }, 600); // 延遲 0.6 秒
}
</script>
</BODY>
</HTML>
